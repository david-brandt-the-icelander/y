[package]
name = "bare-rust"
version = "0.0.0"
edition = "2021"
build = "build.rs"
autoexamples = false

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
serde = { version = "1", features = ["derive"] }
tree-sitter-language = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.58", default-features = false }

[build-dependencies]
cc = "1"
