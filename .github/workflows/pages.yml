# Publishes documentation/ and the language design to GitHub Pages.
# It runs only on a push to main or by hand, and needs Pages enabled with
# "GitHub Actions" as its source in the repository settings.
name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - documentation/**
      - Y-current-language-design.md
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the documentation
        run: python3 .github/pages/stage.py . "$RUNNER_TEMP/site" "https://github.com/${{ github.repository }}/blob/main"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ${{ runner.temp }}/site
          destination: ${{ runner.temp }}/_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
